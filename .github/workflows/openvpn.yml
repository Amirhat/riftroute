name: openvpn (macOS)

# Builds RiftRoute's own openvpn for macOS (scripts/build-openvpn.sh) when the
# script — which holds every pinned version and hash — or this workflow
# changes. It is slow (OpenSSL from source), so it isn't part of every PR's CI;
# the release workflow builds it for real (cached by the same script hash).
on:
  push:
    branches: [main]
    paths:
      - scripts/build-openvpn.sh
      - .github/workflows/openvpn.yml
  pull_request:
    paths:
      - scripts/build-openvpn.sh
      - .github/workflows/openvpn.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # All three builds a release ships, so a release never meets one for the
  # first time. On main this also saves the cache the release restores (a
  # tag can only restore caches saved on the default branch).
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            build/openvpn
            build/openvpn-work/sources
          key: openvpn-${{ runner.os }}-${{ hashFiles('scripts/build-openvpn.sh') }}
      - name: Build openvpn (arm64, x86_64, universal)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          scripts/build-openvpn.sh arm64 build/openvpn/arm64
          scripts/build-openvpn.sh x86_64 build/openvpn/x86_64
          scripts/build-openvpn.sh universal build/openvpn/universal
      # The script already refuses a binary that links anything but macOS's
      # own libraries; check again, independently of it.
      - name: Check it links only macOS's own libraries
        run: |
          for a in arm64 x86_64 universal; do
            f=build/openvpn/$a/openvpn
            otool -L "$f"
            if otool -L "$f" | awk '/^\t/ {print $1}' | grep -Ev '^(/usr/lib/|/System/Library/)'; then
              echo "::error::$f links a library outside /usr/lib and /System"; exit 1
            fi
            if [ "$(otool -l "$f" | grep -c LC_RPATH || true)" != 0 ]; then
              echo "::error::$f has an LC_RPATH"; exit 1
            fi
            codesign --verify --strict "$f"
            ls "build/openvpn/$a/licenses"
          done
          lipo build/openvpn/universal/openvpn -verify_arch arm64 x86_64
          # openvpn 2.6 exits 1 after printing its version: check the text.
          out=$(env -i PATH=/usr/bin:/bin OPENSSL_CONF=/dev/null build/openvpn/arm64/openvpn --version 2>&1 || true)
          echo "$out"
          grep -q '^OpenVPN 2\.6\.' <<<"$out" || { echo "::error::openvpn --version didn't identify itself"; exit 1; }
