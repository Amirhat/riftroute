name: Release

# Tag-driven release: cross-compiled CLI/daemon tarballs + checksums + .deb are
# always built; the signed/notarized macOS .dmg and Linux AppImage are built per
# OS. Code signing + notarization run only when the corresponding secrets exist
# (MAC_*/AC_*), so forks and unsigned dry-runs still succeed (Gatekeeper warns).
# The macOS tarballs and the .dmg ship RiftRoute's own openvpn (the openvpn job)
# and strongSwan's charon-cmd for IKEv2 tunnels (the strongswan job). Both are
# required: if either fails, nothing is published (a release without them
# would leave every new macOS install without tunnels). Never Homebrew's.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (without leading v), e.g. 1.2.3"
        required: true

permissions:
  contents: write

env:
  GO_VERSION: "1.25.x"

jobs:
  # RiftRoute's own openvpn for macOS — the daemon runs only a root-owned copy
  # of it. Static, from pinned and hash-checked sources (scripts/build-openvpn.sh):
  # arm64 + x86_64 for the tarballs, universal for the app. Cached by the
  # script's hash (it holds every pin). A tag can only restore caches saved on
  # the default branch, which openvpn.yml does whenever the script changes on
  # main; a release rebuilds only when that hasn't run.
  openvpn:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            build/openvpn
            build/openvpn-work/sources
          key: openvpn-${{ runner.os }}-${{ hashFiles('scripts/build-openvpn.sh') }}
      - name: Build openvpn (arm64, x86_64, universal)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          scripts/build-openvpn.sh arm64 build/openvpn/arm64
          scripts/build-openvpn.sh x86_64 build/openvpn/x86_64
          scripts/build-openvpn.sh universal build/openvpn/universal
      - name: Check it links only macOS's own libraries (cached builds too)
        run: |
          for a in arm64 x86_64 universal; do
            f=build/openvpn/$a/openvpn
            otool -L "$f"
            if otool -L "$f" | awk '/^\t/ {print $1}' | grep -Ev '^(/usr/lib/|/System/Library/)'; then
              echo "::error::$f links a library outside /usr/lib and /System"; exit 1
            fi
            codesign --verify --strict "$f"
          done
          lipo build/openvpn/universal/openvpn -verify_arch arm64 x86_64
          # openvpn 2.6 exits 1 after printing its version: check the text.
          out=$(env -i PATH=/usr/bin:/bin OPENSSL_CONF=/dev/null build/openvpn/arm64/openvpn --version 2>&1 || true)
          echo "$out"
          grep -q '^OpenVPN 2\.6\.' <<<"$out" || { echo "::error::openvpn --version didn't identify itself"; exit 1; }
      # GPLv2 (OpenVPN, LZO): the complete corresponding source — every
      # tarball the program is built from, LZ4 and OpenSSL included — ships
      # with every release that ships the binary, from the same place.
      - name: Collect the sources
        run: |
          mkdir -p build/openvpn-sources
          cp build/openvpn-work/sources/openvpn-*.tar.gz build/openvpn-work/sources/lzo-*.tar.gz \
            build/openvpn-work/sources/lz4-*.tar.gz build/openvpn-work/sources/openssl-*.tar.gz build/openvpn-sources/
      - uses: actions/upload-artifact@v4
        with:
          name: openvpn-darwin
          path: |
            build/openvpn/arm64
            build/openvpn/x86_64
            build/openvpn/universal
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: openvpn-sources-dist
          path: build/openvpn-sources/
          if-no-files-found: error

  # strongSwan's charon-cmd for macOS IKEv2 tunnels, the same way
  # (scripts/build-strongswan.sh, with RiftRoute's patch in
  # packaging/strongswan). Cached by the script's and the patches' hash;
  # strongswan.yml saves that cache on the default branch.
  strongswan:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            build/strongswan
            build/strongswan-work/sources
          key: strongswan-${{ runner.os }}-${{ hashFiles('scripts/build-strongswan.sh', 'packaging/strongswan/*.patch') }}
      - name: Build charon-cmd (arm64, x86_64, universal)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          scripts/build-strongswan.sh arm64 build/strongswan/arm64
          scripts/build-strongswan.sh x86_64 build/strongswan/x86_64
          scripts/build-strongswan.sh universal build/strongswan/universal
      - name: Check it (cached builds too)
        run: scripts/check-strongswan.sh build/strongswan
      # GPL-2.0-or-later: the complete corresponding source — strongSwan and
      # RiftRoute's patch (OpenSSL's tarball, the same one openvpn is built
      # with, is in openvpn-sources-dist).
      - name: Collect the sources
        run: |
          mkdir -p build/strongswan-sources
          cp build/strongswan-work/sources/strongswan-*.tar.bz2 packaging/strongswan/*.patch build/strongswan-sources/
      - uses: actions/upload-artifact@v4
        with:
          name: strongswan-darwin
          path: |
            build/strongswan/arm64
            build/strongswan/x86_64
            build/strongswan/universal
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: strongswan-sources-dist
          path: build/strongswan-sources/
          if-no-files-found: error

  # Always-buildable core: cross binaries, checksums, .deb. No secrets needed.
  # The darwin tarballs carry the openvpn and strongswan jobs' binaries.
  core:
    needs: [openvpn, strongswan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Resolve VERSION
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }} # never expanded into the script
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            V="$INPUT_VERSION"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=${V#v}" >> "$GITHUB_ENV"
      - name: Get the macOS openvpn
        uses: actions/download-artifact@v4
        with:
          name: openvpn-darwin
          path: build/openvpn
      - name: Get the macOS charon-cmd
        uses: actions/download-artifact@v4
        with:
          name: strongswan-darwin
          path: build/strongswan
      - name: Build cross binaries + checksums
        run: make dist VERSION="${VERSION:-0.0.0}" REQUIRE_OPENVPN=1 REQUIRE_STRONGSWAN=1
      - name: Build .deb (amd64 + arm64)
        run: |
          ARCH=amd64 VERSION="${VERSION:-0.0.0}" packaging/deb/build-deb.sh
          ARCH=arm64 VERSION="${VERSION:-0.0.0}" packaging/deb/build-deb.sh
      - name: Refresh checksums (include debs)
        run: make checksums
      - uses: actions/upload-artifact@v4
        with:
          name: core-dist
          path: dist/

  # macOS GUI → signed/notarized .dmg (signing gated on secrets). Secrets are
  # surfaced as job-level env because the `secrets` context is NOT allowed in an
  # `if:` (that made the whole workflow a startup failure); the step gates on env.
  # The universal openvpn and charon-cmd are bundled and signed with the CLI
  # and daemon.
  dmg:
    needs: [openvpn, strongswan]
    runs-on: macos-latest
    env:
      MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
      MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
      AC_APPLE_ID: ${{ secrets.AC_APPLE_ID }}
      AC_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
      AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Import signing certificate
        if: ${{ env.MAC_CERT_P12 != '' }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/app.keychain-db"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
      - name: Get the macOS openvpn
        uses: actions/download-artifact@v4
        with:
          name: openvpn-darwin
          path: build/openvpn
      - name: Get the macOS charon-cmd
        uses: actions/download-artifact@v4
        with:
          name: strongswan-darwin
          path: build/strongswan
      - name: Build GUI + package DMG
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
          OPENVPN_BIN: ${{ github.workspace }}/build/openvpn/universal/openvpn
          REQUIRE_OPENVPN: "1"
          CHARON_BIN: ${{ github.workspace }}/build/strongswan/universal/charon-cmd
          REQUIRE_STRONGSWAN: "1"
        run: |
          V="${VERSION#v}"
          make desktop-universal VERSION="$V"
          VERSION="$V" packaging/macos/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-dist
          path: dist/*.dmg

  # Linux GUI → AppImage.
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install WebKit deps + FUSE
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libfuse2
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Build GUI + AppImage
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          V="${VERSION#v}"
          BI=github.com/Amirhat/riftroute/internal/buildinfo
          CT=$(TZ=UTC0 git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd)
          cd desktop && "$(go env GOPATH)/bin/wails" build -tags webkit2_41 -trimpath \
            -ldflags "-X main.version=$V -X $BI.linkCommit=$GITHUB_SHA -X $BI.linkCommitTime=$CT -X $BI.linkModified=false"
          cd "$GITHUB_WORKSPACE"
          VERSION="$V" packaging/appimage/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage-dist
          path: dist/*.AppImage

  publish:
    needs: [openvpn, strongswan, core, dmg, appimage]
    # Publish as long as openvpn, strongswan and the always-buildable core
    # succeeded; a flaky GUI build (dmg/appimage) then just omits those
    # artifacts rather than blocking the whole release. download-artifact
    # fetches whatever succeeded — only the *-dist artifacts (the openvpn and
    # charon-cmd binaries reach users inside the tarballs and the app; their
    # sources are openvpn-sources-dist and strongswan-sources-dist).
    if: ${{ always() && needs.openvpn.result == 'success' && needs.strongswan.result == 'success' && needs.core.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*-dist"
      - name: Flatten + final checksums
        run: |
          mkdir -p release
          find artifacts -type f ! -name checksums.txt -exec cp {} release/ \;
          (cd release && find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum > checksums.txt)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          files: release/*
          generate_release_notes: true
